<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Explore Black Candle Lab Zero in a mysterious and playful browser-based Budgie RPG.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Black Candle Lab Zero">
  <meta property="og:title" content="Black Candle Lab Zero - A Budgie RPG">
  <meta property="og:description" content="Explore Black Candle Lab Zero in a mysterious and playful browser-based Budgie RPG.">
  <meta property="og:url" content="https://malrikthemad.github.io/Black-Candle-Lab-Zero/">
  <meta property="og:image" content="https://malrikthemad.github.io/Black-Candle-Lab-Zero/assets/Social/wing-master.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Wing Master Cricket from Black Candle Lab Zero">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Black Candle Lab Zero - A Budgie RPG">
  <meta name="twitter:description" content="Explore Black Candle Lab Zero in a mysterious and playful browser-based Budgie RPG.">
  <meta name="twitter:image" content="https://malrikthemad.github.io/Black-Candle-Lab-Zero/assets/Social/wing-master.png">
  <meta name="twitter:image:alt" content="Wing Master Cricket from Black Candle Lab Zero">
  <link rel="canonical" href="https://malrikthemad.github.io/Black-Candle-Lab-Zero/">
  <title>Black Candle Lab Zero</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/character-sheet.css">
  <link rel="stylesheet" href="css/controls.css">
  <link rel="stylesheet" href="css/interiors.css">
  <link rel="stylesheet" href="css/dilly.css">
  <link rel="stylesheet" href="css/sprites.css">
  <link rel="stylesheet" href="css/dialogue.css">
  <link rel="stylesheet" href="css/transition-cues.css">
  <link rel="stylesheet" href="css/areas/outside.css">
  <link rel="stylesheet" href="css/areas/forest.css">
</head>
<body>
  <main id="stage" class="stage" aria-label="Black Candle Lab Zero A Budgie RPG">
    <div id="world" class="world">
      <div class="forest-floor" aria-hidden="true"></div>
      <div class="map-layer map-water" aria-hidden="true"></div>
      <div class="map-layer map-sand" aria-hidden="true"></div>
      <div class="map-building lab-zero-building" aria-label="Lab Zero"></div>
      <div class="map-sign forest-sign" aria-label="Forest path sign"></div>
      <div id="target" class="target" aria-hidden="true"></div>
      <div id="player" class="player" aria-label="Little Wing"><div class="pixel-bird" aria-hidden="true"></div></div>
    </div>

    <div id="forest-area" class="forest-area" aria-label="Forest" hidden>
      <div class="forest-base-layer" aria-hidden="true"></div>
      <div class="forest-tree-layer" aria-hidden="true"></div>
      <div class="forest-transition-marker" aria-hidden="true"></div>
      <div class="forest-map-sign cricket-thicket-sign" aria-label="Cricket Thicket path sign"></div>
      <div class="forest-dilly-building" aria-label="Old Dilly and Liz's treehouse"></div>
      <div class="majira-npc" aria-label="Majira"></div>
      <div id="forest-target" class="target" aria-hidden="true"></div>
      <div id="forest-player" class="player" aria-label="Little Wing"><div class="pixel-bird" aria-hidden="true"></div></div>
    </div>

    <div id="lab-interior" class="lab-interior" aria-label="Inside Lab Zero" hidden>
      <div class="lab-floor" aria-hidden="true"></div>
      <div class="lab-furniture-layer" aria-hidden="true"></div>
      <div class="lab-npcs-layer" aria-hidden="true"></div>
      <div class="lab-transition-layer" aria-hidden="true"></div>
      <div class="lab-stairs-up" aria-label="Stairs up to the bedroom"></div>
      <div class="lab-exit-door" aria-label="Exit Lab Zero"></div>
      <div class="lab-pc-monitor" aria-label="Lab Core terminal"></div>
      <div class="wing-master-cricket" aria-label="Wing Master Cricket"></div>
      <div class="candlewick-terminal" aria-label="Candlewick workstation"></div>
      <div id="interior-target" class="target" aria-hidden="true"></div>
      <div id="interior-player" class="player" aria-label="Little Wing"><div class="pixel-bird" aria-hidden="true"></div></div>
    </div>

    <div id="bedroom-interior" class="bedroom-interior" aria-label="Little Wing and the wizard's bedroom" hidden>
      <div class="bedroom-floor" aria-hidden="true"></div>
      <div class="bedroom-furniture-layer" aria-hidden="true"></div>
      <div class="bedroom-cage-art" aria-hidden="true"></div>
      <div class="bedroom-transition-layer" aria-hidden="true"></div>
      <div class="bedroom-ladder" aria-label="Stairs down to Lab Zero"></div>
      <div id="bedroom-target" class="target" aria-hidden="true"></div>
      <div id="bedroom-player" class="player" aria-label="Little Wing"><div class="pixel-bird" aria-hidden="true"></div></div>
    </div>
    <div id="dilly-interior" class="dilly-interior" aria-label="Inside Old Dilly and Liz's treehouse" hidden>
      <div class="dilly-floor" aria-hidden="true"></div>
      <div class="dilly-npcs-layer" aria-hidden="true"></div>
      <div class="dilly-transition-layer" aria-hidden="true"></div>
      <div class="old-dilly-npc" aria-label="Old Dilly"></div>
      <div class="liz-npc" aria-label="Liz"></div>
      <div class="dilly-exit" aria-label="Exit Old Dilly and Liz's"></div>
      <div id="dilly-target" class="target" aria-hidden="true"></div>
      <div id="dilly-player" class="player" aria-label="Little Wing"><div class="pixel-bird" aria-hidden="true"></div></div>
    </div>

    <div id="zoom-controls" class="zoom-controls" aria-label="Zoom controls">
      <button id="zoom-out" type="button" aria-label="Zoom out">-</button>
      <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
    </div>

    <div id="readout" class="readout">
      <div class="sheet-header">
        <img class="sheet-portrait" src="assets/portraits/little-wing.png" alt="Little Wing portrait">
        <div>
          <div class="sheet-name">Little Wing</div>
        </div>
      </div>
      <div class="stat-row"><span>Status</span><strong>Bird Assassin</strong></div>
      <div class="stat-row"><span>HP</span><strong>100</strong></div>
      <div class="stat-row"><span>Level</span><strong>1</strong></div>
    </div>

    <div id="flight-controls" class="flight-controls" aria-label="Flight controls">
      <button id="flight-toggle" type="button" aria-label="Take flight" aria-pressed="false">Fly</button>
    </div>

    <nav id="quick-nav" class="quick-nav" aria-label="Little Wing menu">
      <a href="pages/characters.html">Character</a>
      <a href="pages/inventory.html">Inventory</a>
      <a href="pages/map.html">Map</a>
      <a href="pages/quests.html">Quest</a>
    </nav>
    <div id="start-menu" class="start-menu" aria-label="Black Candle Lab Zero start menu">
      <div class="start-menu-art" aria-hidden="true">
        <img class="start-menu-art-frame start-menu-art-frame-1" src="assets/portraits/menu-display/paint-palette-animation-1.png" alt="" decoding="async" fetchpriority="high">
        <img class="start-menu-art-frame start-menu-art-frame-2" src="assets/portraits/menu-display/paint-palette-animation-2.png" alt="" decoding="async">
        <img class="start-menu-art-frame start-menu-art-frame-3" src="assets/portraits/menu-display/paint-palette-animation-3.png" alt="" decoding="async">
        <img class="start-menu-art-frame start-menu-art-frame-4" src="assets/portraits/menu-display/paint-palette-animation-4.png" alt="" decoding="async">
        <img class="start-menu-art-frame start-menu-art-frame-5" src="assets/portraits/menu-display/paint-palette-animation-5.png" alt="" decoding="async">
      </div>
      <div class="start-menu-bar">
        <div class="start-menu-title">
          <span>Black Candle Labs</span>
          <h2>Lab Zero</h2>
        </div>
        <p class="start-menu-tutorial">Push screen to move. Push objects and characters to interact with them. Camera zoom is at the top right.</p>
        <button id="warm-fire" class="warm-fire-button" type="button">Warm your hands by the fire</button>
        <div class="start-menu-actions">
          <button id="new-game" type="button">New Game</button>
          <button id="continue-game" type="button" hidden>Continue</button>
          <button id="clear-save" class="clear-save-button" type="button">Clear Save</button>
        </div>
      </div>
    </div>
    <div id="intro-card" class="intro-card" aria-label="Black Candle Lab Zero intro" hidden>
      <div class="intro-card-copy">
        <h1 id="intro-title">Black Candle Labs</h1>
        <p id="intro-credit" class="intro-credit">Lead Developer, Writer, Animater Kevin Klinkert</p>
        <p id="intro-subtitle" class="intro-subtitle">presents</p>
        <button id="intro-start" type="button">Start</button>
      </div>
    </div>
  </main>

  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/pickups.js"></script>
  <script src="js/dialogue.js"></script>
  <script src="js/dialogues/opening.js"></script>
  <script src="js/dialogues/cricket.js"></script>
  <script src="js/dialogues/candlewick.js"></script>
  <script src="js/dialogues/lab-core.js"></script>
  <script src="js/dialogues/dilly.js"></script>
  <script src="js/dialogues/liz.js"></script>
  <script src="js/dialogues/majira.js"></script>
  <script src="js/menu-state.js"></script>
</body>
</html>
